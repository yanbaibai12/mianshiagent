[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
  ".venv",
  ".venv-codex",
  "alembic",
  "backups",
  "models",
  "qdrant_storage",
  "uploads",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"app/dependencies.py" = ["B008"]
"app/routers/*.py" = ["B008"]
"app/services/auth_service.py" = ["B008"]
"scripts/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
files = [
  "app/config.py",
  "app/middleware.py",
  "app/agent_platform/agents.py",
  "app/agent_platform/contracts.py",
  "app/agent_platform/harness.py",
  "app/agent_platform/mcp.py",
  "app/agent_platform/run_store.py",
  "app/agent_platform/runtime.py",
  "app/agent_platform/skills.py",
  "app/routers/agent_shadow.py",
  "app/services/ai_context_security.py",
  "app/services/data_contract_audit.py",
  "app/services/interview_context_builder.py",
  "app/services/interview_generation_service.py",
  "app/services/interview_scoring_service.py",
  "app/services/interview_templates.py",
  "app/services/release_checks.py",
  "app/services/usage_telemetry.py",
  "app/utils/security.py",
  "app/utils/time.py",
]
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
exclude = ["^alembic/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"

[tool.coverage.run]
branch = false
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
# Phase 0 CI ratchet. The release quality gate remains 85%; see docs/QUALITY_GATE_STANDARD.md.
fail_under = 64
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.coverage.json]
output = "artifacts/coverage/backend-coverage.json"
pretty_print = true
