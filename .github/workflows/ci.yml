name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements-dev.txt
      - name: Run backend quality gate
        run: >-
          python scripts/run_quality_gate.py
          --profile backend
          --mode ci
          --report artifacts/quality-gate/backend.json
      - name: Upload backend quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-quality-evidence
          if-no-files-found: error
          path: |
            artifacts/quality-gate/backend.json
            backend/artifacts/coverage/backend-coverage.json

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Run frontend quality gate
        run: >-
          python scripts/run_quality_gate.py
          --profile frontend
          --mode ci
          --report artifacts/quality-gate/frontend.json
      - name: Upload frontend quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-quality-evidence
          if-no-files-found: error
          path: |
            artifacts/quality-gate/frontend.json
            frontend/coverage

  contract-and-security-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements-dev.txt
      - name: Run contract and security quality gate
        run: >-
          python scripts/run_quality_gate.py
          --profile contracts
          --mode ci
          --report artifacts/quality-gate/contracts.json
      - name: Upload contract quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-quality-evidence
          if-no-files-found: error
          path: artifacts/quality-gate/contracts.json

  e2e:
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality, contract-and-security-quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
